name: Deploy Frontend to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Trigger Render Deploy Hook
        run: |
          echo "Deploying frontend to Render..."
          curl -X POST "$RENDER_DEPLOY_HOOK"
